    // --- WEB AUDIO API AMBIENCE ENGINE ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.oscillators = [];
        this.gain = null;
        this.playing = false;
      }
      start() {
        if (this.playing) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!this.ctx) this.ctx = new AudioCtx();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        this.gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        const freqs = [130.81, 196.0, 293.66, 329.63];
        this.oscillators = freqs.map((freq, i) => {
          const osc = this.ctx.createOscillator();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.detune.setValueAtTime(i * 2 - 3, this.ctx.currentTime);

          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.015, this.ctx.currentTime);
          osc.connect(g);
          g.connect(filter);
          osc.start();
          return osc;
        });

        filter.connect(this.gain);
        this.gain.connect(this.ctx.destination);
        this.gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        this.gain.gain.exponentialRampToValueAtTime(0.06, this.ctx.currentTime + 2.5);
        this.playing = true;
      }
      stop() {
        if (!this.playing || !this.gain) return;
        this.gain.gain.setValueAtTime(this.gain.gain.value, this.ctx.currentTime);
        this.gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1);
        setTimeout(() => {
          this.oscillators.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
          this.oscillators = [];
          this.playing = false;
        }, 1100);
      }
    }
    const audioSynth = new SoundManager();

    // ==========================================
    // 2. CUSTOM CURSOR
    // ==========================================
    function CustomCursor() {
      const [pos, setPos] = useState({ x: -100, y: -100 });
      const [trail, setTrail] = useState({ x: -100, y: -100 });
      const [isHover, setIsHover] = useState(false);

      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;
        const move = (e) => {
          setPos({ x: e.clientX, y: e.clientY });
          const target = e.target;
          if (target && target.closest('button, a, input, select, textarea, .film-card, .service-card')) {
            setIsHover(true);
          } else {
            setIsHover(false);
          }
        };
        window.addEventListener('mousemove', move);
        return () => window.removeEventListener('mousemove', move);
      }, []);

      useEffect(() => {
        let frame;
        const lerp = (a, b, n) => a + (b - a) * n;
        const tick = () => {
          setTrail(prev => ({ x: lerp(prev.x, pos.x, 0.18), y: lerp(prev.y, pos.y, 0.18) }));
          frame = requestAnimationFrame(tick);
        };
        frame = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frame);
      }, [pos]);

      if (pos.x < 0) return null;

      return (
        <React.Fragment>
          <div className="fixed top-0 left-0 pointer-events-none z-[9999] -translate-x-1/2 -translate-y-1/2" style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)` }}>
            <div className={`w-2 h-2 rounded-full bg-[#D6B574] shadow-[0_0_10px_#D6B574] transition-transform ${isHover ? 'scale-150' : 'scale-100'}`} />
          </div>
          <div className="fixed top-0 left-0 pointer-events-none z-[9998] -translate-x-1/2 -translate-y-1/2" style={{ transform: `translate3d(${trail.x}px, ${trail.y}px, 0)` }}>
            <div className={`rounded-full border border-[#D6B574]/40 transition-all duration-300 ${isHover ? 'w-12 h-12 border-[#D6B574] bg-[#D6B574]/10' : 'w-7 h-7'}`} />
          </div>
        </React.Fragment>
      );
    }

    // ==========================================
    // 14. MASTER APP ROOT
    // ==========================================
    function App() {
      const [showIntro, setShowIntro] = useState(() => !sessionStorage.getItem('capture_intro_done'));
      const [isMuted, setIsMuted] = useState(true);
      const [activeModalFilm, setActiveModalFilm] = useState(null);
      const [prefilledService, setPrefilledService] = useState('');
      const [isCRMOpen, setIsCRMOpen] = useState(false);

      const [leads, setLeads] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('capture_ayush_leads') || '[]');
        } catch(e) {
          return [];
        }
      });

      // Fetch persisted leads on load from server.js
      useEffect(() => {
        fetch('/api/bookings')
          .then(res => res.json())
          .then(serverLeads => {
            if (Array.isArray(serverLeads) && serverLeads.length > 0) {
              setLeads(serverLeads);
              localStorage.setItem('capture_ayush_leads', JSON.stringify(serverLeads));
            }
          })
          .catch(() => {});

        const checkHash = () => {
          if (window.location.hash === '#admin') {
            setIsCRMOpen(true);
          }
        };
        checkHash();
        window.addEventListener('hashchange', checkHash);
        return () => window.removeEventListener('hashchange', checkHash);
      }, []);

      const handleIntroDone = () => {
        setShowIntro(false);
        sessionStorage.setItem('capture_intro_done', 'true');
      };

      const handleToggleSound = () => {
        if (isMuted) {
          audioSynth.start();
          setIsMuted(false);
        } else {
          audioSynth.stop();
          setIsMuted(true);
        }
      };

      const handleSelectService = (title) => {
        setPrefilledService(title);
        const el = document.querySelector('#booking');
        if (el) {
          const top = el.getBoundingClientRect().top + window.pageYOffset - 80;
          window.scrollTo({ top, behavior: 'smooth' });
        }
      };

      const handleNewLead = (newLead) => {
        setLeads(prev => {
          const updated = [newLead, ...prev];
          localStorage.setItem('capture_ayush_leads', JSON.stringify(updated));
          return updated;
        });

        fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newLead),
        }).catch(() => {});
      };

      const handleUpdateStatus = (id, newStatus) => {
        setLeads(prev => {
          const updated = prev.map(l => l.id === id ? { ...l, status: newStatus } : l);
          localStorage.setItem('capture_ayush_leads', JSON.stringify(updated));
          return updated;
        });
      };

      const handleDeleteLead = (id) => {
        if (!confirm('Are you sure you want to delete this inquiry?')) return;
        setLeads(prev => {
          const updated = prev.filter(l => l.id !== id);
          localStorage.setItem('capture_ayush_leads', JSON.stringify(updated));
          return updated;
        });
        fetch(`/api/bookings/${id}`, { method: 'DELETE' }).catch(() => {});
      };

      const handleAddDemoLead = () => {
        const demo = {
          id: 'demo_' + Date.now(),
          name: 'Pooja & Amit Verma',
          phone: '9876543210',
          eventType: '01 – Wedding Cinematography',
          eventDate: '2026-12-18',
          location: 'Nagpur Heritage Palace',
          shootDuration: 'Full Day Coverage',
          budget: '₹50,000 - ₹1,00,000',
          message: 'Looking for cinematic couple entry shots, teaser reel for Instagram, and full ceremony coverage.',
          submittedAt: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }),
          status: 'NEW',
        };
        handleNewLead(demo);
      };

      const handleExportCSV = () => {
        if (leads.length === 0) {
          alert('No inquiries to export yet!');
          return;
        }
        const headers = ['ID', 'Client Name', 'Phone', 'Event Type', 'Event Date', 'Location', 'Duration', 'Budget', 'Message', 'Status', 'Submitted At'];
        const rows = leads.map(l => [
          l.id,
          `"${(l.name||'').replace(/"/g, '""')}"`,
          `"${(l.phone||'').replace(/"/g, '""')}"`,
          `"${(l.eventType||'').replace(/"/g, '""')}"`,
          `"${(l.eventDate||'').replace(/"/g, '""')}"`,
          `"${(l.location||'').replace(/"/g, '""')}"`,
          `"${(l.shootDuration||'').replace(/"/g, '""')}"`,
          `"${(l.budget||'').replace(/"/g, '""')}"`,
          `"${(l.message||'').replace(/"/g, '""')}"`,
          l.status || 'NEW',
          `"${l.submittedAt || ''}"`
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `ayush_videography_leads_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="relative min-h-screen bg-[#080808] text-[#F5F5F5] font-sans selection:bg-[#D6B574] selection:text-[#080808] overflow-x-hidden">
          <CustomCursor />

          {showIntro && <IntroAnimation onComplete={handleIntroDone} />}

          <Navbar
            isMuted={isMuted}
            onToggleSound={handleToggleSound}
            onOpenCRM={() => setIsCRMOpen(true)}
            leadsCount={leads.length}
          />

          <main>
            <Hero onOpenShowreel={() => setActiveModalFilm(FILMS[0])} />
            <About />
            <Services onSelectService={handleSelectService} />
            <Portfolio onOpenFilmModal={film => setActiveModalFilm(film)} />
            <SignatureExperience />
            <BookingSection
              prefilledService={prefilledService}
              onNewLead={handleNewLead}
            />
            <ContactSection />
          </main>

          <Footer
            onReplayIntro={() => { setShowIntro(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            onOpenCRM={() => setIsCRMOpen(true)}
            leadsCount={leads.length}
          />

          {/* Floating WhatsApp Action Button */}
          <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-3 select-none">
            <a
              href={BRAND.whatsappDirectLink}
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Chat with Ayush on WhatsApp"
              className="relative w-14 h-14 rounded-full bg-[#25D366] hover:bg-[#20ba5a] flex items-center justify-center text-black shadow-[0_10px_30px_rgba(37,211,102,0.4)] transition-transform duration-300 transform hover:scale-110 active:scale-95"
            >
              <span className="absolute -inset-1 rounded-full bg-[#25D366]/40 animate-ping pointer-events-none"></span>
              <span className="text-2xl">💬</span>
            </a>
          </div>

          <FilmModal
            film={activeModalFilm}
            onClose={() => setActiveModalFilm(null)}
            onBookSimilar={handleSelectService}
          />

          {/* Studio CRM & Leads Management Application Modal */}
          <AdminLeadsModal
            isOpen={isCRMOpen}
            onClose={() => setIsCRMOpen(false)}
            leads={leads}
            onUpdateStatus={handleUpdateStatus}
            onDeleteLead={handleDeleteLead}
            onAddDemoLead={handleAddDemoLead}
            onExportCSV={handleExportCSV}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
